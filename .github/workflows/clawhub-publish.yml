name: Publish skills to ClawHub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 预检模式（只验证不发布）
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Login with token
        run: clawhub login --token "$CLAWHUB_TOKEN" --label "github-actions-publish"
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Publish skills
        run: |
          set -eu
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
            echo "预检模式：只验证，不发布"
          fi
          for skill in flydb flydb-cli-release flydb-migration-scripts flydb-multi-environment; do
            echo "===== $skill ====="
            clawhub skill publish "skills/$skill" \
              --slug "$skill" \
              --owner zzxCoding \
              --categories development \
              --topics flydb,database-migration,jdbc \
              --source-repo zzxCoding/skills \
              --source-commit "$GITHUB_SHA" \
              $DRY
          done
